name: Cargo ORG PG16 / Bento RC2 consumer contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  org-pg16-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.12-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cargo_contract
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cargo_contract"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: "true"
      GOPRIVATE: go.idp.xyz
      GOPROXY: direct
      GIT_TERMINAL_PROMPT: "0"
      GOTOOLCHAIN: local
      IDP_CARGO_MIGRATOR_DSN: postgres://postgres:ci-only@127.0.0.1:5432/cargo_contract?sslmode=disable
      IDP_CARGO_POSTGRES_DSN: postgres://cargo_app:ci-app-only@127.0.0.1:5432/cargo_contract?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - name: Resolve immutable framework dependency
        run: |
          test "$(go list -m -f '{{.Version}}' go.idp.xyz/idp-bento-go)" = v0.1.0-rc.2
          go mod download -json go.idp.xyz/idp-bento-go@v0.1.0-rc.2 > /tmp/bento-rc2.json
          jq -e '.Sum == "h1:W9T1KsbXwuVs3lHTNwSUcEBY0Ids00hUH7I9KuBtCEo="' /tmp/bento-rc2.json
          go mod download
          go mod verify
      - name: Package rules and CODEOWNERS (D1-D6, AC2, AC3, AC7)
        run: go run ./tools/dependency-check
      - name: Apply framework + cargo migrations (operator-only tool)
        run: go run ./cmd/cargo-migrate -manifest migrations/manifest/contexts.txt -apply
      - name: Isolate application from migrator and privileged roles
        env:
          PGPASSWORD: ci-only
        run: |
          psql -h 127.0.0.1 -U postgres -d cargo_contract -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cargo_app LOGIN PASSWORD 'ci-app-only' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE cargo_contract TO cargo_app;
          GRANT USAGE ON SCHEMA cargo_org,cargo_rate,cargo_com,bento TO cargo_app;
          GRANT SELECT ON ALL TABLES IN SCHEMA cargo_org TO cargo_app;
          DO $role_grant$ DECLARE tab text; BEGIN
            FOR tab IN SELECT tablename FROM pg_tables
              WHERE schemaname='cargo_org' AND tablename <> 'reference_code_edition' LOOP
              EXECUTE format('GRANT INSERT,UPDATE,DELETE ON cargo_org.%I TO cargo_app',tab);
            END LOOP;
          END $role_grant$;
          GRANT SELECT,INSERT,UPDATE ON cargo_rate.quote TO cargo_app;
          GRANT SELECT,INSERT ON cargo_rate.quote_line,cargo_rate.command_receipt TO cargo_app;
          GRANT SELECT,INSERT,UPDATE ON cargo_com.customer_order TO cargo_app;
          GRANT SELECT,INSERT ON cargo_com.order_line,cargo_com.fulfillment_obligation,cargo_com.command_receipt TO cargo_app;
          GRANT SELECT,INSERT ON cargo_com.obligation_reservation TO cargo_app;
          GRANT UPDATE (released_by,released_at) ON cargo_com.obligation_reservation TO cargo_app;
          GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA bento TO cargo_app;
          GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA bento TO cargo_app;
          SQL
      - name: Real ORG + Bento contracts (no skipped DB tests)
        run: go test -tags integration -count=1 -v ./...
      - name: Race detector
        run: go test -tags integration -race -count=1 ./...
      - name: Go vet
        run: go vet -tags integration ./...
