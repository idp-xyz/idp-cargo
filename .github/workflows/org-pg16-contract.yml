name: Cargo ORG PG16 / Bento RC2 consumer contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  org-pg16-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.12-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cargo_contract
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cargo_contract"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: "true"
      GOPRIVATE: go.idp.xyz
      GOPROXY: direct
      GIT_TERMINAL_PROMPT: "0"
      GOTOOLCHAIN: local
      IDP_CARGO_MIGRATOR_DSN: postgres://postgres:ci-only@127.0.0.1:5432/cargo_contract?sslmode=disable
      IDP_CARGO_POSTGRES_DSN: postgres://cargo_app:ci-app-only@127.0.0.1:5432/cargo_contract?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - name: Resolve immutable framework dependency
        run: |
          test "$(go list -m -f '{{.Version}}' go.idp.xyz/idp-bento-go)" = v0.1.0-rc.2
          go mod download -json go.idp.xyz/idp-bento-go@v0.1.0-rc.2 > /tmp/bento-rc2.json
          jq -e '.Sum == "h1:W9T1KsbXwuVs3lHTNwSUcEBY0Ids00hUH7I9KuBtCEo="' /tmp/bento-rc2.json
          go mod download
          go mod verify
      - name: Package rules and CODEOWNERS (D1-D6, AC2, AC3, AC7)
        run: go run ./tools/dependency-check
      - name: Apply framework + cargo migrations (operator-only tool)
        run: go run ./cmd/cargo-migrate -manifest migrations/manifest/contexts.txt -apply
      - name: Isolate application from migrator and privileged roles
        env:
          PGPASSWORD: ci-only
        run: |
          psql -h 127.0.0.1 -U postgres -d cargo_contract -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cargo_app LOGIN PASSWORD 'ci-app-only' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE cargo_contract TO cargo_app;
          GRANT USAGE ON SCHEMA cargo_org,cargo_rate,cargo_com,cargo_ful,cargo_phy,cargo_book,cargo_air,cargo_doc,bento,cargo_ref TO cargo_app;
          GRANT SELECT ON ALL TABLES IN SCHEMA cargo_ref TO cargo_app;
          GRANT SELECT ON ALL TABLES IN SCHEMA cargo_org TO cargo_app;
          DO $role_grant$ DECLARE tab text; BEGIN
            FOR tab IN SELECT tablename FROM pg_tables
              WHERE schemaname='cargo_org' AND tablename <> 'reference_code_edition' AND tablename NOT LIKE 'party\_address%' AND tablename NOT LIKE 'party\_contact%' AND tablename <> 'party_identifier' LOOP
              EXECUTE format('GRANT INSERT,UPDATE,DELETE ON cargo_org.%I TO cargo_app',tab);
            END LOOP;
          END $role_grant$;
          GRANT INSERT,UPDATE ON cargo_org.party_address_book,cargo_org.party_address,cargo_org.party_contact TO cargo_app;
          GRANT INSERT ON cargo_org.party_address_book_change,cargo_org.party_address_version,cargo_org.party_address_default,cargo_org.party_contact_version,cargo_org.party_contact_default TO cargo_app;
          GRANT UPDATE (name,phone,mobile,email,erased) ON cargo_org.party_contact_version TO cargo_app;
          GRANT INSERT ON cargo_org.party_identifier TO cargo_app;
          GRANT INSERT ON cargo_org.party_contact_consent,cargo_org.party_contact_access TO cargo_app;
          GRANT UPDATE (retired_by,retired_at,retire_reason,retired_revision) ON cargo_org.party_identifier TO cargo_app;
          GRANT SELECT,INSERT,UPDATE ON cargo_rate.quote TO cargo_app;
          GRANT SELECT,INSERT ON cargo_rate.quote_line,cargo_rate.quote_exchange_rate,cargo_rate.command_receipt TO cargo_app;
          GRANT SELECT,INSERT,UPDATE ON cargo_com.customer_order TO cargo_app;
          GRANT SELECT,INSERT ON cargo_com.order_line,cargo_com.order_line_amendment,cargo_com.order_policy,cargo_com.fulfillment_obligation,cargo_com.command_receipt TO cargo_app;
          GRANT SELECT,INSERT ON cargo_com.obligation_reservation TO cargo_app;
          GRANT UPDATE (released_by,released_at) ON cargo_com.obligation_reservation TO cargo_app;
          GRANT SELECT,INSERT ON cargo_com.order_transport,cargo_com.order_party,cargo_com.order_party_contact TO cargo_app;
          GRANT UPDATE (name,phone,mobile,email,erased) ON cargo_com.order_party_contact TO cargo_app;
          GRANT SELECT,INSERT ON cargo_com.order_contact_retention,cargo_com.order_contact_erasure TO cargo_app;
          GRANT SELECT,INSERT ON cargo_com.order_contact_access TO cargo_app;
          GRANT SELECT,INSERT ON cargo_com.order_party_lock TO cargo_app;
          GRANT UPDATE (released_by,released_at,release_entered_at) ON cargo_com.order_party_lock TO cargo_app;
          GRANT SELECT,INSERT,UPDATE ON cargo_ful.shipment TO cargo_app;
          GRANT SELECT,INSERT ON cargo_ful.shipment_obligation,cargo_ful.shipment_plan_version,cargo_ful.shipment_plan_confirmation,cargo_ful.command_receipt TO cargo_app;
          GRANT UPDATE (released_by,released_at) ON cargo_ful.shipment_obligation TO cargo_app;
          GRANT SELECT,INSERT ON cargo_ful.shipment_consol_attachment TO cargo_app;
          GRANT SELECT,INSERT ON cargo_ful.shipment_load_evidence,cargo_ful.shipment_load_evidence_screening TO cargo_app;
          GRANT UPDATE (ended_by,ended_at,end_reason,end_entered_at) ON cargo_ful.shipment_consol_attachment TO cargo_app;
          GRANT SELECT,INSERT,UPDATE ON cargo_phy.consolidation,cargo_phy.consol_membership TO cargo_app;
          GRANT SELECT,INSERT ON cargo_phy.consolidation_version,cargo_phy.membership_entry,cargo_phy.membership_entry_part,cargo_phy.command_receipt TO cargo_app;
          GRANT UPDATE (end_kind,end_reason,end_text,ended_by,ended_at,end_entered_at,successor_no) ON cargo_phy.membership_entry TO cargo_app;
          GRANT SELECT,INSERT ON cargo_phy.cargo_lot,cargo_phy.receipt_line,cargo_phy.measurement_version,cargo_phy.measurement_package_group,cargo_phy.screening_result,cargo_phy.cargo_discrepancy,cargo_phy.load_execution,cargo_phy.load_line,cargo_phy.reversal_line,cargo_phy.hold_entry,cargo_phy.carrier_load_evidence,cargo_phy.loading_discrepancy TO cargo_app;
          GRANT UPDATE (state,expected_ful_revision,expected_plan_version,expected_packs,expected_weight_unit,expected_gross_weight,expected_volume_unit,expected_volume,completed_by,completed_at,completed_entered_at,closed_by,closed_at,closed_entered_at,revision,updated_at) ON cargo_phy.cargo_lot TO cargo_app;
          GRANT UPDATE (resolution,resolution_reference,resolution_text,resolved_by,resolved_at,resolution_entered_at) ON cargo_phy.cargo_discrepancy,cargo_phy.loading_discrepancy TO cargo_app;
          GRANT UPDATE (state,started_by,started_at,started_entered_at,closed_by,closed_at,closed_entered_at,close_evidence_source,close_evidence_reference,close_evidence_sha256,close_evidence_occurred_at,revision,updated_at) ON cargo_phy.load_execution TO cargo_app;
          GRANT UPDATE (release_evidence_source,release_evidence_reference,release_evidence_sha256,release_evidence_occurred_at,released_by,released_at,release_entered_at) ON cargo_phy.hold_entry TO cargo_app;
          GRANT SELECT,INSERT ON ALL TABLES IN SCHEMA cargo_book TO cargo_app;
          GRANT UPDATE (status,current_request_version,current_capacity_version,consumer_id,withdraw_reason,withdrawn_by,withdrawn_at,revision,updated_at) ON cargo_book.carrier_booking TO cargo_app;
          GRANT UPDATE (live) ON cargo_book.carrier_reference TO cargo_app;
          GRANT SELECT,INSERT ON ALL TABLES IN SCHEMA cargo_air TO cargo_app;
          GRANT UPDATE (state,mawb_status,cancel_reason,cancelled_by,cancelled_at,revision,updated_at) ON cargo_air.air_movement TO cargo_app;
          GRANT UPDATE (end_kind,ended_by,ended_at,end_entered_at,successor_no) ON cargo_air.house_waybill TO cargo_app;
          GRANT UPDATE (next_seq,revision) ON cargo_air.hawb_series TO cargo_app;
          GRANT SELECT,INSERT ON ALL TABLES IN SCHEMA cargo_doc TO cargo_app;
          GRANT UPDATE (state,cancel_reason,cancelled_by,cancelled_at,revision,updated_at) ON cargo_doc.transport_document TO cargo_app;
          GRANT UPDATE (withdrawn_by,withdrawn_at,withdraw_reason,withdraw_entered_at,revision) ON cargo_doc.issuance_authority TO cargo_app;
          GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA bento TO cargo_app;
          GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA bento TO cargo_app;
          SQL
      - name: Real ORG + Bento contracts (no skipped DB tests)
        run: go test -tags integration -count=1 -v ./...
      - name: Race detector
        run: go test -tags integration -race -count=1 ./...
      - name: Go vet
        run: go vet -tags integration ./...
